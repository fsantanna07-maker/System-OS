<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agendamentos de OS | Prudente Seg Soluções - SIMPAR</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0B1220; --painel:#121B2E; --painel2:#182440; --borda:#243352;
  --texto:#E7EDF7; --texto2:#9DB0CC; --verde:#00A859; --verde2:#00CF6B;
  --amarelo:#F9A825; --azul:#2EA3F2; --vermelho:#F87070; --roxo:#B90E80;
}
*{box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',Tahoma,sans-serif;}
body{background:var(--bg); color:var(--texto); min-height:100vh;}

/* ---------- LOGIN ---------- */
#telaLogin{display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;}
.login-box{background:var(--painel); border:1px solid var(--borda); border-radius:16px; padding:36px; width:min(420px,100%);}
.login-box .logo{text-align:center; margin-bottom:22px;}
.login-box h1{font-size:17px; margin-top:12px;}
.login-box .sub{font-size:11.5px; color:var(--texto2); margin-top:5px; line-height:1.5;}
.login-box label{font-size:11px; color:var(--texto2); display:block; margin:14px 0 5px; font-weight:600; text-transform:uppercase; letter-spacing:.4px;}
.login-box input{width:100%; background:var(--painel2); border:1px solid var(--borda); color:var(--texto); border-radius:9px; padding:11px 13px; font-size:14px;}
.login-box input:focus{outline:2px solid var(--verde);}
#erroLogin{color:var(--vermelho); font-size:12px; margin-top:12px; min-height:16px;}
.btn{border:1px solid var(--borda); background:var(--painel2); color:var(--texto); border-radius:8px; padding:9px 14px; font-size:12.5px; cursor:pointer; transition:.15s;}
.btn:hover{border-color:var(--verde);}
.btn-p{background:var(--verde); color:#04110B; font-weight:700; border:none;}
.btn-p:hover{background:var(--verde2);}
.btn-d{background:#3A1A24; color:var(--vermelho); border-color:#5A2A38;}
.login-box .btn-p{width:100%; padding:12px; margin-top:20px; font-size:14px;}

/* ---------- APP ---------- */
#app{display:none;}
header{background:linear-gradient(120deg,#0E2B1E,#00A85922); border-bottom:1px solid var(--borda); padding:14px 22px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
header h1{font-size:16px;}
header h1 b{color:var(--verde2);}
header .sub{font-size:11px; color:var(--texto2); margin-top:3px;}
.header-dir{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
#statusSync{font-size:11px; color:var(--texto2); background:var(--painel); border:1px solid var(--borda); border-radius:20px; padding:6px 12px;}
#statusSync.online{border-color:var(--verde); color:var(--verde2);}
#statusSync.offline{border-color:#5A2A38; color:var(--vermelho);}
.usuario-tag{font-size:11.5px; color:var(--texto2);}
.usuario-tag b{color:var(--verde2);}
nav{display:flex; gap:2px; padding:0 16px; background:var(--painel); border-bottom:1px solid var(--borda); overflow-x:auto; flex-wrap:wrap;}
nav button{background:none; border:none; color:var(--texto2); padding:12px 16px; font-size:13px; cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap;}
nav button.ativo{color:var(--verde2); font-weight:600; border-bottom-color:var(--verde);}
main{padding:20px 20px 90px; max-width:1480px; margin:0 auto;}
.rodape{position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; justify-content:space-between; align-items:center; padding:8px 20px; background:rgba(10,16,28,.95); border-top:1px solid var(--borda);}
.rodape img{height:46px; width:auto; display:block; background:#fff; padding:4px 10px; border-radius:8px;}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px;}
.kpi{background:var(--painel); border:1px solid var(--borda); border-radius:12px; padding:14px 16px;}
.kpi .lbl{font-size:10.5px; font-weight:700; color:var(--texto2); text-transform:uppercase; letter-spacing:.5px;}
.kpi .val{font-size:26px; font-weight:700; margin-top:4px;}
.card{background:var(--painel); border:1px solid var(--borda); border-radius:12px; padding:16px; margin-top:14px;}
.card h3{font-size:13.5px; color:var(--verde2); margin-bottom:12px;}
.barra-linha{display:flex; align-items:center; gap:8px; margin-bottom:7px; font-size:12px;}
.barra-linha .nome{width:190px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.barra-linha .trilha{flex:1; height:14px; background:var(--painel2); border-radius:7px; overflow:hidden;}
.barra-linha .fill{display:block; height:100%; transition:width .6s; background:linear-gradient(90deg,var(--verde),var(--verde2)); border-radius:7px;}
.barra-linha .num{width:40px; text-align:right; color:var(--texto2);}
.barra-linha .stack{flex:1;}
.stack{display:flex; height:22px; background:var(--painel2); border-radius:7px; overflow:hidden;}
.stack span{display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; color:#04110B; overflow:hidden;}
.legenda{display:flex; flex-wrap:wrap; gap:14px; font-size:11.5px; color:var(--texto2); margin-bottom:14px;}
.legenda i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px;}
.equipes-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:14px; margin-top:14px;}
.equipes-grid .card{margin-top:0;}
.eq-topo{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;}
.eq-topo h3{margin:0;}
.eq-total{font-size:26px; font-weight:700; color:var(--verde2);}
.eq-total small{font-size:11px; color:var(--texto2); font-weight:600;}
.mini-kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.mini{background:var(--painel2); border-radius:8px; padding:8px 10px;}
.mini .l{font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; color:var(--texto2); min-height:24px;}
.mini .v{font-size:22px; font-weight:700; margin-top:2px;}
.tbl-eq{width:100%; border-collapse:collapse;}
.tbl-eq th{font-size:10px; line-height:1.25; vertical-align:bottom; padding:6px 8px; text-align:center; background:none; border-bottom:2px solid var(--borda); white-space:normal;}
.tbl-eq th:first-child{text-align:left;}
.tbl-eq td{padding:10px 8px; text-align:center; font-size:22px; font-weight:700; border-bottom:1px solid var(--borda); vertical-align:middle;}
.tbl-eq td.eqn{text-align:left; font-size:14px; color:var(--texto);}
.tbl-eq td.dist{width:24%; padding:10px 8px;}
.tbl-eq td.dist .stack{height:20px;}
.tbl-eq tr.totalg td{border-bottom:none; border-top:2px solid var(--borda); background:var(--painel2);}
.rot-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
.rot-tit{font-size:12.5px; font-weight:700; color:var(--texto);}
.prog{flex:1; min-width:120px; height:4px; background:var(--painel2); border-radius:2px; overflow:hidden;}
.prog i{display:block; height:100%; width:0; background:var(--verde); animation:prog 15s linear forwards;}
@keyframes prog{to{width:100%;}}
.dots{display:flex; gap:6px;}
.dots b{width:9px; height:9px; border-radius:50%; background:var(--painel2); border:1px solid var(--borda);}
.dots b.on{background:var(--verde); border-color:var(--verde);}
.filtros{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
.filtros input,.filtros select{background:var(--painel2); border:1px solid var(--borda); color:var(--texto); border-radius:8px; padding:9px 12px; font-size:13px;}
.filtros input{min-width:260px; flex:1;}
.contador{font-size:12px; color:var(--texto2); margin-left:auto;}
table{width:100%; border-collapse:collapse; font-size:12px;}
th{background:var(--painel2); color:var(--texto2); text-align:left; padding:9px 10px; font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; white-space:nowrap;}
td{border-bottom:1px solid var(--borda); padding:8px 10px; vertical-align:top;}
tbody tr:hover{background:var(--painel2);}
.pill{display:inline-block; border-radius:12px; padding:3px 10px; font-size:10.5px; font-weight:700;}
.p-ag{background:#12335A; color:#7EC2F2;}
.p-agen{background:#0F3D2A; color:var(--verde2);}
.p-atend{background:#3D330F; color:#FBD35D;}
.p-concl{background:#2A2A3D; color:#B9B9D9;}
.p-canc{background:#3A1A24; color:var(--vermelho);}
.p-paus{background:#3D2A0F; color:#F9A825;}
.p-gar{background:#0F3A3D; color:#5FE0D6;}
.tbl-acao{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
.edit-info{font-size:10.5px; color:var(--texto2);}
.edit-info b{color:var(--azul);}
.pag{display:flex; gap:6px; align-items:center; margin-top:12px; font-size:12px; color:var(--texto2); flex-wrap:wrap;}
.pag button{background:var(--painel2); border:1px solid var(--borda); color:var(--texto); border-radius:6px; padding:5px 10px; cursor:pointer;}
.pag button.ativo{background:var(--verde); color:#04110B; font-weight:700; border-color:var(--verde);}
.modal-fundo{position:fixed; inset:0; background:rgba(4,8,16,.75); display:none; align-items:flex-start; justify-content:center; z-index:50; overflow-y:auto; padding:30px 14px;}
.modal{background:var(--painel); border:1px solid var(--borda); border-radius:14px; padding:22px; width:min(720px,100%);}
.modal h3{color:var(--verde2); font-size:16px; margin-bottom:16px;}
.form-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
.form-grid .full{grid-column:1/-1;}
.form-grid label{font-size:11px; color:var(--texto2); display:block; margin-bottom:4px; font-weight:600;}
.form-grid input,.form-grid select,.form-grid textarea{width:100%; background:var(--painel2); border:1px solid var(--borda); color:var(--texto); border-radius:8px; padding:9px 10px; font-size:13px;}
.modal .rodape{display:flex; gap:10px; justify-content:flex-end; margin-top:18px;}
#toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--verde); color:#04110B; font-weight:700; padding:11px 20px; border-radius:10px; display:none; z-index:99; font-size:13px;}
.nota{font-size:11.5px; color:var(--texto2); font-style:italic; margin-top:12px; line-height:1.5;}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="telaLogin">
  <div class="login-box">
    <div class="logo" style="font-size:34px">🛠️</div>
    <h1>AGENDAMENTOS DE OS</h1>
    <div class="sub">Prudente Seg Soluções • SIMPAR<br>Sistema compartilhado da equipe — as alterações de todos ficam visíveis aqui</div>
    <label>Seu nome</label>
    <input id="inpNome" placeholder="Digite seu nome" autocomplete="off">
    <label>Código de acesso da equipe</label>
    <input id="inpPin" type="password" placeholder="Código fornecido pela coordenação" onkeydown="if(event.key==='Enter')entrar()">
    <div id="erroLogin"></div>
    <button class="btn btn-p" onclick="entrar()">ENTRAR</button>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
<header>
  <div>
    <h1>🛠️ AGENDAMENTOS DE OS <b>| PRUDENTE SEG • SIMPAR</b></h1>
    <div class="sub" id="subSync">Banco de dados compartilhado — sincronizado com a equipe</div>
  </div>
  <div class="header-dir">
    <span id="statusSync">…</span>
    <button class="btn" onclick="carregar()">↻ Atualizar</button>
    <span class="usuario-tag">👤 <b id="tagUser"></b></span>
    <button class="btn btn-d" onclick="sair()">Sair</button>
  </div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

/* ---------- LOGIN ---------- */
async function entrar(){
  const nome = document.getElementById("inpNome").value.trim();
  const pin = document.getElementById("inpPin").value.trim();
  const erro = document.getElementById("erroLogin");
  if(!nome){ erro.textContent = "Digite seu nome."; return; }
  erro.textContent = "Conectando…";
  try{
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({acao:"listar", pin})});
    const j = await r.json();
    if(!j.ok) throw new Error(j.erro || "Código inválido.");
    sessao = {nome, pin};
    localStorage.setItem(LS, JSON.stringify(sessao));
    iniciarApp(j.registros);
  }catch(e){
    erro.textContent = e.message.includes("Failed to fetch") ? "Sem conexão com o servidor. Verifique sua internet." : e.message;
  }
}
function sair(){ localStorage.removeItem(LS); location.reload(); }

/* ---------- CARREGAR ---------- */
async function carregar(silencioso){
  try{
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({acao:"listar", pin: sessao.pin})});
    const j = await r.json();
    if(!j.ok) throw new Error(j.erro);
    dados = j.registros;
    setStatus(true);
    render();
  }catch(e){
    setStatus(false);
    if(!silencioso) toast("⚠️ Não foi possível sincronizar. Tente atualizar.");
  }
}
function setStatus(online){
  const el = document.getElementById("statusSync");
  const agora = new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  el.textContent = online ? "● Online — " + agora : "○ Sem conexão";
  el.className = online ? "online" : "offline";
}

/* ---------- RENDER ---------- */
function iniciarApp(registros){
  dados = registros;
  document.getElementById("telaLogin").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("tagUser").textContent = sessao.nome;
  render();
  setInterval(()=>carregar(true), 60000);
  agendarRotacao();
  setTimeout(()=>importarIniciais(true), 600);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) carregar(true); });
}

function render(){
  document.getElementById("nav").innerHTML = [
    ["dash","📊 Dashboard"],["equipes","👥 Por Equipe"],["lista","📋 Lista de OS"],["novo2","＋ Novo OS"]
  ].map(([id,n])=>`<button class="${id===tabAtual?'ativo':''}" onclick="${id==='novo2'?'novoRegistro()':`tabAtual='${id}';render()`}">${n}</button>`).join("");
  document.getElementById("main").innerHTML = tabAtual==="dash" ? renderDash() : tabAtual==="equipes" ? renderEquipes() : renderLista();
}

function stats(){
  const porFrente={}, porStatus={}, porTipo={}, porMes={};
  dados.forEach(r=>{
    const t = r.tipoOs||"Sem tipo"; porTipo[t]=(porTipo[t]||0)+1;
    const m = String(r.dataAgendamento||"").match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if(m){ const k = m[3]+"-"+m[2]; porMes[k]=(porMes[k]||0)+1; }
    porFrente[r.frente||"Sem frente"]=(porFrente[r.frente||"Sem frente"]||0)+1;
    porStatus[r.status||"—"]=(porStatus[r.status||"—"]||0)+1;
  });
  const st = k => porStatus[k]||0;
  return {total: dados.length, porFrente, porStatus, porTipo, porMes,
    ag: st("Agendado"), aguard: st("Aguardando Agendamento"), atend: st("Em Atendimento"), concl: st("Concluído"), canc: st("Cancelado"), paus: st("Pausado"), gar: st("Garantia")};
}
/* ---------- DASHBOARD ---------- */
const TELAS_DASH = 4, INTERVALO_DASH = 15000;   // 4 telas em looping, trocando a cada 15 segundos
let telaDash = 0, rotPausada = false, rotInicio = Date.now(), rotTimer = null;
const MESES = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const COR_STATUS = {"Aguardando Agendamento":"#F2C94C","Agendado":"#00D26A","Concluído":"#B9B9D9","Pausado":"#F2994A","Garantia":"#5FE0D6","Cancelado":"#FF6B7A"};
const INDICADORES = [
  ["Aguardando Agendamento","Aguardando Agendamento"],
  ["Agendado","Agendadas"],
  ["Concluído","Concluídas"],
  ["Pausado","Pausadas (aguardando material/equip.)"],
  ["Garantia","Em Garantia (instalação recente)"],
  ["Cancelado","Canceladas"]
];
function agendarRotacao(){
  clearTimeout(rotTimer); rotInicio = Date.now();
  if(rotPausada) return;
  rotTimer = setTimeout(()=>{ telaDash = (telaDash+1)%TELAS_DASH; if(tabAtual==="dash") render(); agendarRotacao(); }, INTERVALO_DASH);
}
function irTela(d){ telaDash = (telaDash+d+TELAS_DASH)%TELAS_DASH; agendarRotacao(); render(); }
function alternarRotacao(){ rotPausada = !rotPausada; agendarRotacao(); render(); }
function telaCheia(){ if(document.fullscreenElement) document.exitFullscreen(); else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); }

function itensDe(obj, ordem){
  const l = Object.entries(obj).map(([k,n])=>({k, n, label:k}));
  return ordem==="chave" ? l.sort((a,b)=>a.k.localeCompare(b.k)) : l.sort((a,b)=>b.n-a.n);
}
function barrasCard(titulo, itens, corFn){
  if(!itens.length) return "";
  const max = Math.max(...itens.map(i=>i.n));
  return `<div class="card"><h3>${titulo}</h3>${itens.map(i=>`<div class="barra-linha"><span class="nome">${esc(i.label)}</span><span class="trilha"><span class="fill" style="width:${max?(i.n/max*100).toFixed(0):0}%${corFn?";background:"+corFn(i.k):""}"></span></span><span class="num">${i.n}</span></div>`).join("")}</div>`;
}
const corStatus = k => COR_STATUS[k] || "var(--verde)";

function telaIndicadores(s){
  const kpi = (l,v,c)=>`<div class="kpi"><div class="lbl">${l}</div><div class="val" style="color:${c}">${v}</div></div>`;
  return `<div class="kpis">
    ${kpi("Total de OS", s.total, "var(--verde2)")}
    ${INDICADORES.map(([k,l])=>kpi(l, s.porStatus[k]||0, COR_STATUS[k])).join("")}
  </div>
  <div class="nota">ℹ️ Os dados são sincronizados automaticamente a cada minuto e a cada alteração salva. Toda a equipe vê as mesmas informações em tempo real.</div>`;
}
function telaFrenteStatus(s){
  return barrasCard("📌 Chamados por frente / equipe", itensDe(s.porFrente)) +
         barrasCard("📊 Chamados por status", itensDe(s.porStatus), corStatus);
}
function telaTipoMes(s){
  const meses = itensDe(s.porMes,"chave").map(i=>{ const [a,m]=i.k.split("-"); return {...i, label: MESES[+m-1]+"/"+a}; });
  return barrasCard("🧰 Chamados por tipo de OS", itensDe(s.porTipo)) +
         barrasCard("📅 Agendamentos por mês", meses);
}
function renderDash(){
  const s = stats();
  const titulos = ["Indicadores gerais","Chamados por frente e por status","Tipos de OS e agendamentos por mês","Indicadores por equipe"];
  const corpo = [telaIndicadores, telaFrenteStatus, telaTipoMes, telaEquipesCompacta][telaDash](s);
  const el = Math.min((Date.now()-rotInicio)/1000, INTERVALO_DASH/1000);
  return `<div class="rot-bar">
    <span class="rot-tit">Tela ${telaDash+1} de ${TELAS_DASH} · ${titulos[telaDash]}</span>
    <div class="dots">${[0,1,2,3].map(i=>`<b class="${i===telaDash?'on':''}"></b>`).join("")}</div>
    <div class="prog">${rotPausada?"":`<i style="animation-duration:${INTERVALO_DASH/1000}s;animation-delay:-${el.toFixed(1)}s"></i>`}</div>
    <button class="btn" onclick="irTela(-1)">◀</button>
    <button class="btn" onclick="alternarRotacao()">${rotPausada?"▶ Retomar troca automática":`⏸ Pausar troca (${INTERVALO_DASH/1000} s)`}</button>
    <button class="btn" onclick="irTela(1)">▶</button>
    <button class="btn" onclick="telaCheia()">⛶ Tela cheia</button>
  </div>` + corpo;
}

function telaEquipesCompacta(){
  const m = {};
  dados.forEach(r=>{ const f=r.frente||"Sem frente"; const o=m[f]||(m[f]={total:0,st:{}}); o.total++; o.st[r.status]=(o.st[r.status]||0)+1; });
  const eq = Object.entries(m).sort((a,b)=>b[1].total-a[1].total);
  if(!eq.length) return `<div class="card">Nenhum chamado cadastrado.</div>`;
  const stack = o=>INDICADORES.map(([k,l])=>{
    const n=o.st[k]||0; if(!n) return "";
    const w=n/o.total*100;
    return `<span style="width:${w.toFixed(2)}%;background:${COR_STATUS[k]}" title="${l}: ${n}">${w>=8?n:""}</span>`;
  }).join("");
  const tot = {total:0, st:{}};
  eq.forEach(([f,o])=>{ tot.total+=o.total; Object.entries(o.st).forEach(([k,n])=>tot.st[k]=(tot.st[k]||0)+n); });
  const linha = (nome,o,cls)=>`<tr${cls?` class="${cls}"`:""}><td class="eqn">${esc(nome)}</td><td style="color:var(--verde2)">${o.total}</td>${INDICADORES.map(([k])=>`<td style="color:${COR_STATUS[k]}">${o.st[k]||0}</td>`).join("")}<td class="dist"><div class="stack">${stack(o)}</div></td></tr>`;
  return `<div class="card" style="margin-top:0"><h3>👥 Indicadores por equipe</h3>
    <table class="tbl-eq"><thead><tr><th>Equipe</th><th style="color:var(--verde2)">Total</th>${INDICADORES.map(([k,l])=>`<th style="color:${COR_STATUS[k]};border-bottom-color:${COR_STATUS[k]}">${l}</th>`).join("")}<th>Distribuição</th></tr></thead>
    <tbody>${eq.map(([f,o])=>linha(f,o)).join("")}${linha("Total geral",tot,"totalg")}</tbody></table>
  </div>`;
}
function renderEquipes(){
  const m = {};
  dados.forEach(r=>{ const f=r.frente||"Sem frente"; const o=m[f]||(m[f]={total:0,st:{}}); o.total++; o.st[r.status]=(o.st[r.status]||0)+1; });
  const eq = Object.entries(m).sort((a,b)=>b[1].total-a[1].total);
  if(!eq.length) return `<div class="card">Nenhum chamado cadastrado.</div>`;
  const maxT = eq[0][1].total;
  const stack = (o,base)=>INDICADORES.map(([k,l])=>{
    const n = o.st[k]||0; if(!n) return "";
    const w = n/base*100;
    return `<span style="width:${w.toFixed(2)}%;background:${COR_STATUS[k]}" title="${l}: ${n}">${w>=5?n:""}</span>`;
  }).join("");
  const legenda = INDICADORES.map(([k,l])=>`<span><i style="background:${COR_STATUS[k]}"></i>${l}</span>`).join("");
  return `<div class="card"><h3>👥 Status por equipe</h3>
    <div class="legenda">${legenda}</div>
    ${eq.map(([f,o])=>`<div class="barra-linha"><span class="nome">${esc(f)}</span><div class="stack">${stack(o,maxT)}</div><span class="num">${o.total}</span></div>`).join("")}
  </div>
  <div class="equipes-grid">
  ${eq.map(([f,o])=>{
    const soma = INDICADORES.reduce((a,[k])=>a+(o.st[k]||0),0);
    const outros = o.total - soma;
    return `<div class="card eq-card">
      <div class="eq-topo"><h3>${esc(f)}</h3><div class="eq-total">${o.total}<small> OS</small></div></div>
      <div class="mini-kpis">${INDICADORES.map(([k,l])=>`<div class="mini"><div class="l">${l}</div><div class="v" style="color:${COR_STATUS[k]}">${o.st[k]||0}</div></div>`).join("")}</div>
      <div class="stack" style="margin-top:12px">${stack(o,o.total)}</div>
      ${outros>0?`<div style="font-size:11px;color:var(--texto2);margin-top:8px">Outros status: ${outros}</div>`:""}
    </div>`;
  }).join("")}
  </div>`;
}

function filtrar(){
  const q = norm(filtros.q);
  return dados.filter(r=>{
    if(filtros.frente && r.frente!==filtros.frente) return false;
    if(filtros.status && r.status!==filtros.status) return false;
    if(q){
      const alvo = norm([r.codigo,r.cliente,r.tecnico,r.agendadoPor,r.dataAgendamento,r.observacoes,r.status,r.frente].join(" "));
      const termos = q.split(/\s+/).filter(Boolean);
      if(!termos.every(t=>alvo.includes(t))) return false;
    }
    return true;
  });
}

}

/* ---------- CRUD ---------- */
function novoRegistro(){ abrirForm(null); }
function editarRegistro(id){ const r = dados.find(x=>x.id===id); if(r) abrirForm(r); }
function abrirForm(r){
  const e = r || {};
  document.getElementById("modalCorpo").innerHTML = `
  <h3>${r?"Editar OS "+esc(r.codigo):"Nova Ordem de Serviço"}</h3>
  <div class="form-grid">
    <div><label>Código da OS *</label><input id="f_codigo" value="${esc(e.codigo||"")}" ${r?"":"placeholder='Ex.: 1353386446'"}></div>
    <div><label>Frente / equipe</label><select id="f_frente">${opcoes(FRENTES, e.frente)}</select></div>
    <div class="full"><label>Cliente / unidade *</label><input id="f_cliente" value="${esc(e.cliente||"")}" placeholder="Ex.: 0246 - MOVIDA RAC BLUMENAU -SC"></div>
    <div><label>Tipo de OS</label><select id="f_tipoOs">${opcoes(TIPOS_OS, e.tipoOs)}</select></div>
    <div><label>Data do agendamento</label><input id="f_data" value="${esc(e.dataAgendamento||"")}" placeholder="Ex.: 20/10/2026 às 14:00"></div>
    <div><label>Status</label><select id="f_status">${opcoes(STATUS, e.status)}</select></div>
    <div><label>Técnico</label><input id="f_tecnico" value="${esc(e.tecnico||"")}"></div>
    <div class="full"><label>Agendado por</label><input id="f_agendadoPor" value="${esc(e.agendadoPor||sessao.nome)}"></div>
    <div class="full"><label>Observações</label><textarea id="f_obs" rows="3">${esc(e.observacoes||"")}</textarea></div>
  </div>
  <div class="rodape">
    ${r?`<button class="btn btn-d" onclick="excluirRegistro('${r.id}',true)">Excluir</button>`:""}
    <button class="btn" onclick="fecharModal()">Cancelar</button>
    <button class="btn btn-p" onclick="salvarForm(${r?`'${r.id}'`:"null"})">💾 Salvar e sincronizar</button>
  </div>`;
  document.getElementById("modalFundo").style.display = "flex";
}
function opcoes(lista, atual){
  const l = (atual && !lista.includes(atual)) ? [...lista, atual] : lista;
  return l.map(v=>`<option ${v===atual?'selected':''}>${esc(v)}</option>`).join("");
}
function fecharModal(){ document.getElementById("modalFundo").style.display = "none"; }

async function salvarForm(id){
  const d = {
    id, codigo: document.getElementById("f_codigo").value.trim(),
    cliente: document.getElementById("f_cliente").value.trim(),
    frente: document.getElementById("f_frente").value,
    tipoOs: document.getElementById("f_tipoOs").value,
    dataAgendamento: document.getElementById("f_data").value.trim(),
    status: document.getElementById("f_status").value,
    tecnico: document.getElementById("f_tecnico").value.trim(),
    agendadoPor: document.getElementById("f_agendadoPor").value.trim(),
    observacoes: document.getElementById("f_obs").value.trim(),
    ultimoEditor: sessao.nome,
  };
  if(!d.codigo || !d.cliente){ toast("⚠️ Código e Cliente são obrigatórios."); return; }
  try{
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({acao:"salvar", pin: sessao.pin, dados: d})});
    const j = await r.json();
    if(!j.ok) throw new Error(j.erro);
    fecharModal();
    await carregar(true);
    toast("✓ Salvo e sincronizado com a equipe");
  }catch(e){ toast("⚠️ Erro ao salvar: " + e.message); }
}

async function excluirRegistro(id, doModal){
  if(!confirm("Excluir esta OS do banco compartilhado?")) return;
  try{
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({acao:"excluir", pin: sessao.pin, id})});
    const j = await r.json();
    if(!j.ok) throw new Error(j.erro);
    if(doModal) fecharModal();
    await carregar(true);
    toast("✓ Excluído");
  }catch(e){ toast("⚠️ Erro ao excluir: " + e.message); }
}

/* ---------- IMPORTAÇÃO ---------- */
async function migrarStatus(){
  const FLAG = "os_migr_status_v2";
  try{ if(localStorage.getItem(FLAG)) return; }catch(e){}
  const REGRAS = {"Garantia":{para:"Garantia", de:["Aguardando Agendamento","Pausado"]}, "SP-Capital":{para:"Agendado", de:["Pausado"]}};
  const alvo = [];
  DADOS_INICIAIS.forEach(d=>{
    const rg = REGRAS[d.frente]; if(!rg) return;
    const ex = dados.find(r=>String(r.codigo||"").trim()===d.codigo && r.frente===d.frente && rg.de.includes(r.status));
    if(ex) alvo.push({r:ex, para:rg.para});
  });
  let falhas = 0;
  for(let i=0; i<alvo.length; i+=5){
    await Promise.all(alvo.slice(i,i+5).map(async ({r,para})=>{
      try{
        const dd = {id:r.id, codigo:r.codigo, cliente:r.cliente, frente:r.frente, tipoOs:r.tipoOs, dataAgendamento:r.dataAgendamento||"",
          status:para, tecnico:r.tecnico||"", agendadoPor:r.agendadoPor||"", observacoes:r.observacoes||"", ultimoEditor:sessao.nome};
        const res = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({acao:"salvar", pin:sessao.pin, dados:dd})});
        const j = await res.json(); if(!j.ok) throw new Error(j.erro);
      }catch(e){ falhas++; }
    }));
  }
  if(!falhas){ try{ localStorage.setItem(FLAG,"1"); }catch(e){} }
  if(alvo.length) await carregar(true);
}
function pendentesImport(){
  const existentes = new Set(dados.map(r=>String(r.codigo||"").trim()));
  return DADOS_INICIAIS.filter(d=>!existentes.has(d.codigo));
}
async function importarIniciais(auto){ // roda sozinho ao entrar; não há botão na tela
  if(importando) return;
  importando = true;
  try{
    await carregar(true);               // atualiza a lista antes, para não duplicar
    await migrarStatus();
    const novos = pendentesImport();
    if(!novos.length){ if(!auto) toast("ℹ️ Todas as OS da planilha já estão no sistema."); return; }
    if(!auto && !confirm(`Importar ${novos.length} OS para o banco compartilhado da equipe?`)) return;
    let ok = 0, falhas = 0, primeiroErro = "";
    for(let i=0; i<novos.length; i+=5){
      await Promise.all(novos.slice(i,i+5).map(async d=>{
        try{
          const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({acao:"salvar", pin: sessao.pin, dados: {...d, id:null, ultimoEditor: sessao.nome}})});
          const j = await r.json();
          if(!j.ok) throw new Error(j.erro || "resposta sem ok");
          ok++;
        }catch(e){ falhas++; if(!primeiroErro) primeiroErro = e.message; }
      }));
      toast(`Importando planilha… ${ok+falhas}/${novos.length}`);
    }
    await carregar(true);
    if(falhas) alert(`Importação: ${ok} OS gravadas, ${falhas} com erro.\nMotivo do primeiro erro: ${primeiroErro}\n\nClique em "Importar dados da planilha" para repetir só as que faltam.`);
    else toast(`✓ ${ok} OS da planilha importadas`);
  } finally { importando = false; render(); }
}

function exportarExcel(){
  const lista = filtrar();

    "Data Agendamento": r.dataAgendamento, "Status": r.status, "Técnico": r.tecnico,
    "Agendado por": r.agendadoPor, "Observações": r.observacoes,
    "Última edição": (r.ultimoEditor? r.ultimoEditor+" em ":"") + (r.updated_date? new Date(r.updated_date).toLocaleString("pt-BR") : ""),
  }));
  const ws = XLSX.utils.json_to_sheet(linhas);

  XLSX.utils.book_append_sheet(wb, ws, "Agendamentos OS");
  XLSX.writeFile(wb, "Agendamentos_OS_PrudenteSeg_SIMPAR.xlsx");
}
