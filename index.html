/* ---------- LOGIN ---------- */
async function entrar(){
  const nome = document.getElementById("inpNome").value.trim();
  const pin = document.getElementById("inpPin").value.trim();
  const erro = document.getElementById("erroLogin");
  if(!nome){ erro.textContent = "Digite seu nome."; return; }
  erro.textContent = "Conectando…";
  try{
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({acao:"listar", pin})});
    const j = await r.json();
    if(!j.ok) throw new Error(j.erro || "Código inválido.");
    sessao = {nome, pin};
    localStorage.setItem(LS, JSON.stringify(sessao));
    iniciarApp(j.registros);
  }catch(e){
    erro.textContent = e.message.includes("Failed to fetch") ? "Sem conexão com o servidor. Verifique sua internet." : e.message;
  }
}
function sair(){ localStorage.removeItem(LS); location.reload(); }

/* ---------- CARREGAR ---------- */
async function carregar(silencioso){
  try{
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({acao:"listar", pin: sessao.pin})});
    const j = await r.json();
    if(!j.ok) throw new Error(j.erro);
    dados = j.registros;
    setStatus(true);
    render();
  }catch(e){
    setStatus(false);
    if(!silencioso) toast("⚠️ Não foi possível sincronizar. Tente atualizar.");
  }
}
function setStatus(online){
  const el = document.getElementById("statusSync");
  const agora = new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  el.textContent = online ? "● Online — " + agora : "○ Sem conexão";
  el.className = online ? "online" : "offline";
}

/* ---------- RENDER ---------- */
function iniciarApp(registros){
  dados = registros;
  document.getElementById("telaLogin").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("tagUser").textContent = sessao.nome;
  render();
  setInterval(()=>carregar(true), 60000);
  agendarRotacao();
  setTimeout(()=>importarIniciais(true), 600);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) carregar(true); });
}

function render(){
  document.getElementById("nav").innerHTML = [
    ["dash","📊 Dashboard"],["equipes","👥 Por Equipe"],["lista","📋 Lista de OS"],["novo2","＋ Novo OS"]
  ].map(([id,n])=>`<button class="${id===tabAtual?'ativo':''}" onclick="${id==='novo2'?'novoRegistro()':`tabAtual='${id}';render()`}">${n}</button>`).join("");
  document.getElementById("main").innerHTML = tabAtual==="dash" ? renderDash() : tabAtual==="equipes" ? renderEquipes() : renderLista();
}

  const st = k => porStatus[k]||0;
  return {total: dados.length, porFrente, porStatus, porTipo, porMes,
    ag: st("Agendado"), aguard: st("Aguardando Agendamento"), atend: st("Em Atendimento"), concl: st("Concluído"), canc: st("Cancelado"), paus: st("Pausado"), gar: st("Garantia")};
}
/* ---------- DASHBOARD ---------- */
const TELAS_DASH = 3, INTERVALO_DASH = 30000;   // 3 telas, trocando a cada 30 segundos
let telaDash = 0, rotPausada = false, rotInicio = Date.now(), rotTimer = null;
const MESES = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const COR_STATUS = {"Aguardando Agendamento":"#F2C94C","Agendado":"#00D26A","Concluído":"#B9B9D9","Pausado":"#F2994A","Garantia":"#5FE0D6","Cancelado":"#FF6B7A"};
const INDICADORES = [
  ["Aguardando Agendamento","Aguardando Agendamento"],
  ["Agendado","Agendadas"],
  ["Concluído","Concluídas"],
  ["Pausado","Pausadas (aguardando material/equip.)"],
  ["Garantia","Em Garantia (instalação recente)"],
  ["Cancelado","Canceladas"]
];
function agendarRotacao(){
  clearTimeout(rotTimer); rotInicio = Date.now();
  if(rotPausada) return;
  rotTimer = setTimeout(()=>{ telaDash = (telaDash+1)%TELAS_DASH; if(tabAtual==="dash") render(); agendarRotacao(); }, INTERVALO_DASH);
}
function irTela(d){ telaDash = (telaDash+d+TELAS_DASH)%TELAS_DASH; agendarRotacao(); render(); }
function alternarRotacao(){ rotPausada = !rotPausada; agendarRotacao(); render(); }
function telaCheia(){ if(document.fullscreenElement) document.exitFullscreen(); else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); }

function itensDe(obj, ordem){
  const l = Object.entries(obj).map(([k,n])=>({k, n, label:k}));
  return ordem==="chave" ? l.sort((a,b)=>a.k.localeCompare(b.k)) : l.sort((a,b)=>b.n-a.n);
}
function barrasCard(titulo, itens, corFn){
  if(!itens.length) return "";
  const max = Math.max(...itens.map(i=>i.n));
  return `<div class="card"><h3>${titulo}</h3>${itens.map(i=>`<div class="barra-linha"><span class="nome">${esc(i.label)}</span><span class="trilha"><span class="fill" style="width:${max?(i.n/max*100).toFixed(0):0}%${corFn?";background:"+corFn(i.k):""}"></span></span><span class="num">${i.n}</span></div>`).join("")}</div>`;
}
const corStatus = k => COR_STATUS[k] || "var(--verde)";

function telaIndicadores(s){
  const kpi = (l,v,c)=>`<div class="kpi"><div class="lbl">${l}</div><div class="val" style="color:${c}">${v}</div></div>`;
  return `<div class="kpis">
    ${kpi("Total de OS", s.total, "var(--verde2)")}
    ${INDICADORES.map(([k,l])=>kpi(l, s.porStatus[k]||0, COR_STATUS[k])).join("")}
  </div>
  <div class="nota">ℹ️ Os dados são sincronizados automaticamente a cada minuto e a cada alteração salva. Toda a equipe vê as mesmas informações em tempo real.</div>`;
}
function telaFrenteStatus(s){
  return barrasCard("📌 Chamados por frente / equipe", itensDe(s.porFrente)) +
         barrasCard("📊 Chamados por status", itensDe(s.porStatus), corStatus);
}
function telaTipoMes(s){
  const meses = itensDe(s.porMes,"chave").map(i=>{ const [a,m]=i.k.split("-"); return {...i, label: MESES[+m-1]+"/"+a}; });
  return barrasCard("🧰 Chamados por tipo de OS", itensDe(s.porTipo)) +
         barrasCard("📅 Agendamentos por mês", meses);
}
function renderDash(){
  const s = stats();
  const titulos = ["Indicadores gerais","Chamados por frente e por status","Tipos de OS e agendamentos por mês"];
  const corpo = [telaIndicadores, telaFrenteStatus, telaTipoMes][telaDash](s);
  const el = Math.min((Date.now()-rotInicio)/1000, INTERVALO_DASH/1000);
  return `<div class="rot-bar">
    <span class="rot-tit">Tela ${telaDash+1} de ${TELAS_DASH} · ${titulos[telaDash]}</span>
    <div class="dots">${[0,1,2].map(i=>`<b class="${i===telaDash?'on':''}"></b>`).join("")}</div>
    <div class="prog">${rotPausada?"":`<i style="animation-delay:-${el.toFixed(1)}s"></i>`}</div>
    <button class="btn" onclick="irTela(-1)">◀</button>
    <button class="btn" onclick="alternarRotacao()">${rotPausada?"▶ Retomar troca automática":"⏸ Pausar troca (30 s)"}</button>
    <button class="btn" onclick="irTela(1)">▶</button>
    <button class="btn" onclick="telaCheia()">⛶ Tela cheia</button>
  </div>` + corpo;
}

function renderEquipes(){
  const m = {};
  dados.forEach(r=>{ const f=r.frente||"Sem frente"; const o=m[f]||(m[f]={total:0,st:{}}); o.total++; o.st[r.status]=(o.st[r.status]||0)+1; });
  const eq = Object.entries(m).sort((a,b)=>b[1].total-a[1].total);
  if(!eq.length) return `<div class="card">Nenhum chamado cadastrado.</div>`;
  const maxT = eq[0][1].total;
  const stack = (o,base)=>INDICADORES.map(([k,l])=>{
    const n = o.st[k]||0; if(!n) return "";
    const w = n/base*100;
    return `<span style="width:${w.toFixed(2)}%;background:${COR_STATUS[k]}" title="${l}: ${n}">${w>=5?n:""}</span>`;
  }).join("");
  const legenda = INDICADORES.map(([k,l])=>`<span><i style="background:${COR_STATUS[k]}"></i>${l}</span>`).join("");
  return `<div class="card"><h3>👥 Status por equipe</h3>
    <div class="legenda">${legenda}</div>
    ${eq.map(([f,o])=>`<div class="barra-linha"><span class="nome">${esc(f)}</span><div class="stack">${stack(o,maxT)}</div><span class="num">${o.total}</span></div>`).join("")}
  </div>
  <div class="equipes-grid">
  ${eq.map(([f,o])=>{
    const soma = INDICADORES.reduce((a,[k])=>a+(o.st[k]||0),0);
    const outros = o.total - soma;
    return `<div class="card eq-card">
      <div class="eq-topo"><h3>${esc(f)}</h3><div class="eq-total">${o.total}<small> OS</small></div></div>
      <div class="mini-kpis">${INDICADORES.map(([k,l])=>`<div class="mini"><div class="l">${l}</div><div class="v" style="color:${COR_STATUS[k]}">${o.st[k]||0}</div></div>`).join("")}</div>
      <div class="stack" style="margin-top:12px">${stack(o,o.total)}</div>
      ${outros>0?`<div style="font-size:11px;color:var(--texto2);margin-top:8px">Outros status: ${outros}</div>`:""}
    </div>`;
  }).join("")}
  </div>`;
}

function filtrar(){
  const q = norm(filtros.q);
  return dados.filter(r=>{
    if(filtros.frente && r.frente!==filtros.frente) return false;
    if(filtros.status && r.status!==filtros.status) return false;
    if(q){
      const alvo = norm([r.codigo,r.cliente,r.tecnico,r.agendadoPor,r.dataAgendamento,r.observacoes,r.status,r.frente].join(" "));
      const termos = q.split(/\s+/).filter(Boolean);
      if(!termos.every(t=>alvo.includes(t))) return false;
    }
    return true;
  });
}

function opcoes(lista, atual){
  const l = (atual && !lista.includes(atual)) ? [...lista, atual] : lista;
  return l.map(v=>`<option ${v===atual?'selected':''}>${esc(v)}</option>`).join("");
}

async function salvarForm(id){
  const d = {
    id, codigo: document.getElementById("f_codigo").value.trim(),
    cliente: document.getElementById("f_cliente").value.trim(),
    frente: document.getElementById("f_frente").value,
    tipoOs: document.getElementById("f_tipoOs").value,

      body: JSON.stringify({acao:"excluir", pin: sessao.pin, id})});

    if(!j.ok) throw new Error(j.erro);
    if(doModal) fecharModal();
    await carregar(true);
    toast("✓ Excluído");
  }catch(e){ toast("⚠️ Erro ao excluir: " + e.message); }
}

/* ---------- IMPORTAÇÃO ---------- */
async function migrarStatus(){
  const FLAG = "os_migr_status_v2";
  try{ if(localStorage.getItem(FLAG)) return; }catch(e){}
  const REGRAS = {"Garantia":{para:"Garantia", de:["Aguardando Agendamento","Pausado"]}, "SP-Capital":{para:"Agendado", de:["Pausado"]}};
  const alvo = [];
  DADOS_INICIAIS.forEach(d=>{
    const rg = REGRAS[d.frente]; if(!rg) return;
    const ex = dados.find(r=>String(r.codigo||"").trim()===d.codigo && r.frente===d.frente && rg.de.includes(r.status));
    if(ex) alvo.push({r:ex, para:rg.para});
  });
  let falhas = 0;
  for(let i=0; i<alvo.length; i+=5){
    await Promise.all(alvo.slice(i,i+5).map(async ({r,para})=>{
      try{
        const dd = {id:r.id, codigo:r.codigo, cliente:r.cliente, frente:r.frente, tipoOs:r.tipoOs, dataAgendamento:r.dataAgendamento||"",
          status:para, tecnico:r.tecnico||"", agendadoPor:r.agendadoPor||"", observacoes:r.observacoes||"", ultimoEditor:sessao.nome};
        const res = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({acao:"salvar", pin:sessao.pin, dados:dd})});
        const j = await res.json(); if(!j.ok) throw new Error(j.erro);
      }catch(e){ falhas++; }
    }));
  }
  if(!falhas){ try{ localStorage.setItem(FLAG,"1"); }catch(e){} }
  if(alvo.length) await carregar(true);
}
function pendentesImport(){
  const existentes = new Set(dados.map(r=>String(r.codigo||"").trim()));
  return DADOS_INICIAIS.filter(d=>!existentes.has(d.codigo));
}
async function importarIniciais(auto){ // roda sozinho ao entrar; não há botão na tela
  if(importando) return;
  importando = true;
  try{
    await carregar(true);               // atualiza a lista antes, para não duplicar
    await migrarStatus();
    const novos = pendentesImport();
    if(!novos.length){ if(!auto) toast("ℹ️ Todas as OS da planilha já estão no sistema."); return; }
    if(!auto && !confirm(`Importar ${novos.length} OS para o banco compartilhado da equipe?`)) return;
    let ok = 0, falhas = 0, primeiroErro = "";
    for(let i=0; i<novos.length; i+=5){
      await Promise.all(novos.slice(i,i+5).map(async d=>{
        try{
          const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({acao:"salvar", pin: sessao.pin, dados: {...d, id:null, ultimoEditor: sessao.nome}})});
          const j = await r.json();
          if(!j.ok) throw new Error(j.erro || "resposta sem ok");
          ok++;
        }catch(e){ falhas++; if(!primeiroErro) primeiroErro = e.message; }
      }));
      toast(`Importando planilha… ${ok+falhas}/${novos.length}`);
    }
    await carregar(true);
    if(falhas) alert(`Importação: ${ok} OS gravadas, ${falhas} com erro.\nMotivo do primeiro erro: ${primeiroErro}\n\nClique em "Importar dados da planilha" para repetir só as que faltam.`);
    else toast(`✓ ${ok} OS da planilha importadas`);
  } finally { importando = false; render(); }
}
